<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ l.onOpen }}" style="background:#FFFDF8;border:1px solid #E8DFCC;border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;height:100%;box-sizing:border-box;transition:transform .2s,box-shadow .2s;font-family:'Figtree',system-ui,sans-serif;color:#23211E;" style-hover="box-shadow:0 12px 30px rgba(80,60,30,.12);transform:translateY(-2px);">
  <div style="position:relative;aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#EFE5D0 0 10px,#F6EFE0 10px 20px);display:flex;align-items:center;justify-content:center;">
    <span style="font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#8A7D66;">listing photo · IDX</span>
    <span style="position:absolute;top:12px;left:12px;background:#FBF8F1;border:1px solid #23211E;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:3px;">{{ l.status }}</span>
    <button onClick="{{ l.onFav }}" aria-label="Save home" style="position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:#FFFDF8;color:{{ l.favColor }};font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);">{{ l.heart }}</button>
  </div>
  <div style="padding:14px 16px 18px;display:flex;flex-direction:column;gap:5px;">
    <div style="font-family:'Young Serif',serif;font-size:24px;">{{ l.priceFmt }}</div>
    <div style="font-size:14px;color:#5E5444;display:flex;gap:12px;"><span>{{ l.beds }} bd</span><span>{{ l.baths }} ba</span><span>{{ l.sqftFmt }} sqft</span></div>
    <div style="font-size:15px;font-weight:500;">{{ l.address }}</div>
    <div style="font-size:13px;color:#7A6E5C;">{{ l.area }}, {{ l.city }} · {{ l.county }} Co.</div>
    <sc-if value="{{ l.hasCommute }}" hint-placeholder-val="{{ false }}">
      <div style="font-size:13px;font-weight:600;color:#23211E;background:var(--accSoft,#F4E0C2);border-radius:4px;padding:4px 8px;align-self:start;margin-top:4px;">{{ l.commuteText }}</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:400},&quot;l&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
